<header class="header">
  <div class="logo-area">
    <img src="img/logo.png" alt="Logo" class="logo" />

  </div>

  <nav class="nav">
    <a routerLink="/decks">Decks</a>
    <a routerLink="/create">Criar Deck</a>
    <a routerLink="/ai-tips">Dicas com IA</a>
  </nav>

  <div class="search-area">
    <input
      type="text"
      placeholder="Buscar carta..."
      (search)="search"
    />

  </div>

  <div class="auth">
    <button class="login-btn">Login</button>
  </div>
</header>
