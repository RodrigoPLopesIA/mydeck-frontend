<section class="min-h-screen bg-gray-950 text-white px-6 py-10">

  <div class="max-w-6xl mx-auto">

    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-4xl font-bold text-yellow-400 mb-2">
        {{ deck.name }}
      </h1>

      <p class="text-gray-400">
        {{ deck.description }}
      </p>

      <span class="inline-block mt-4 bg-indigo-600 px-4 py-1 rounded-full text-sm">
        {{ deck.cards.length }} cartas
      </span>
    </div>

    <!-- Grid de Cartas -->
    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">

      @if (deck.cards.length === 0) {

      <p class="text-gray-500 col-span-full text-center">
        Este deck não tem cartas.
      </p>

      } @else {

      @for (card of deck.cards; track card) {

      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 hover:shadow-yellow-400/10 transition">

        <h3 class="text-lg font-semibold text-yellow-300 mb-2">
          {{ card.name }}
        </h3>

        <span class="text-xs bg-gray-800 px-3 py-1 rounded-full">
          {{ card.type }}
        </span>

      </div>

      }

      }

    </div>

  </div>

</section>
